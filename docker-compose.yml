
services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""
    environment:
      - NEXT_PUBLIC_API_URL=""
    restart: always

  backend:
    build:
      context: ./backend
    environment:
      - AI_AGENT_URL=http://ai-backend:8000
      - PORT=5000
    env_file:
      - ./backend/.env
    depends_on:
      - ai-backend
    restart: always

  ai-backend:
    build:
      context: ./ai backend
    env_file:
      - ./ai backend/.env
    restart: always
